services:
  # Backend API
  api:
    build: ../ExpertVakeel-Backend
    container_name: expert_api
    command: npm start
    ports:
      - "4000:4000"
    env_file: ../ExpertVakeel-Backend/.env
    restart: always
    networks:
      - expert-network

  # User Frontend (Expert Vakeel)
  user:
    build: ./expert_vakeel
    container_name: expert_user
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      VITE_API_URL: https://api.legalnetwork.in
    restart: always
    networks:
      - expert-network
    depends_on:
      - api

  # Admin Portal
  admin:
    build: ./admin
    container_name: expert_admin
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      VITE_API_URL: https://api.legalnetwork.in
    restart: always
    networks:
      - expert-network
    depends_on:
      - api

networks:
  expert-network:
    driver: bridge