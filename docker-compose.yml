services:
  # User Frontend (Expert Vakeel)
  user:
    build: ./expert_vakeel
    container_name: expert_user
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      VITE_API_URL: http://localhost:4000
    restart: always
    networks:
      - expert-network

  # Admin Portal
  admin:
    build: ./admin
    container_name: expert_admin
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      VITE_API_URL: http://localhost:4000
    restart: always
    networks:
      - expert-network

networks:
  expert-network:
    driver: bridge
