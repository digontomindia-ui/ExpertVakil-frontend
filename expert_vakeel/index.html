<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/Group1.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expert Vakeel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>

  <!-- MSG91 OTP Widget -->
  <script type="text/javascript">
    var configuration = {
      widgetId: "366273683645393536383436",
      tokenAuth: "433175TFzWj1SwdI6996d0f3P1",
      exposeMethods: true,
      success: function (data) {
        // data.message contains the JWT access-token for server-side validation
        console.log("MSG91 OTP verified, access-token:", data);
        if (window.__msg91SuccessHandler) {
          window.__msg91SuccessHandler(data);
        }
      },
      failure: function (error) {
        console.error("MSG91 OTP failure:", error);
        if (window.__msg91FailureHandler) {
          window.__msg91FailureHandler(error);
        }
      }
    };
  </script>
  <script type="text/javascript">
    (function loadOtpScript(urls) {
      let i = 0;
      function attempt() {
        const s = document.createElement('script');
        s.src = urls[i];
        s.async = true;
        s.onload = () => {
          if (typeof window.initSendOTP === 'function') {
            window.initSendOTP(configuration);
          }
        };
        s.onerror = () => {
          i++;
          if (i < urls.length) {
            attempt();
          }
        };
        document.head.appendChild(s);
      }
      attempt();
    })([
      'https://verify.msg91.com/otp-provider.js',
      'https://verify.phone91.com/otp-provider.js'
    ]);
  </script>

  <!-- Razorpay Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
